---
- name: Firefox-Bereinigungsblock – ausschliesslich expliziter LAB-08A-Test
  hosts: cisco_lab
  become: true
  gather_facts: false
  serial: 1
  pre_tasks:
    - name: Unbeabsichtigte Verteilung verhindern
      ansible.builtin.assert:
        that:
          - lab_block04_test_confirmed | default(false) | bool
          - inventory_hostname == 'LAB-08A'
          - ansible_host == '203.0.113.15'
          - ansible_play_hosts_all == ['LAB-08A']
        fail_msg: >-
          Dieser vorbereitete Testblock darf nur mit --limit LAB-08A und
          -e lab_block04_test_confirmed=true gestartet werden. LAB-08B bleibt unveraendert.
  roles:
    - lab_firefox
