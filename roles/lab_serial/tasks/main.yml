---
- name: IServ-Gruppe aufloesen, keine lokale Ersatzgruppe anlegen
  ansible.builtin.getent:
    database: group
    key: "{{ lab_serial_group }}"

- name: Aufgeloeste GID und Gruppenname pruefen
  ansible.builtin.assert:
    that:
      - lab_serial_group is match('^[a-zA-Z0-9_.-]+$')
      - ansible_facts.getent_group[lab_serial_group][1] | int > 0
    fail_msg: LAB-Gruppe ist nicht sicher aufloesbar; keine Rechte aendern.

- name: Angemeldete Benutzersitzungen vor der Migration ausschliessen
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import subprocess, sys
        output = subprocess.check_output(['loginctl', 'list-sessions', '--no-legend'], text=True)
        for line in output.splitlines():
            info = subprocess.check_output(['loginctl', 'show-session', line.split()[0], '-p', 'Type', '-p', 'Class', '-p', 'Remote'], text=True)
            fields = dict(line.split('=', 1) for line in info.splitlines())
            interactive = fields.get('Type') in ('x11', 'wayland') or (fields.get('Type') == 'tty' and fields.get('Remote') == 'no')
            if interactive and fields.get('Class', '').startswith('user'):
                print('Benutzersitzung vorhanden; Migration erst nach Abmeldung.')
                sys.exit(1)
  check_mode: false
  changed_when: false

- name: Betroffene Systemdateien festhalten
  ansible.builtin.set_fact:
    lab_block02_files:
      - /etc/cisco-lab/serial.json
      - /usr/local/bin/lab-serial-console
      - /usr/local/share/applications/putty.desktop
      - /usr/share/applications/cisco-console.desktop
      - /etc/udev/rules.d/99-cisco-usb.rules
      - /etc/tmpfiles.d/cisco-lab-serial.conf
      - /etc/xdg/autostart/lab-putty-defaults.desktop

- name: Systemdateien vor der ersten Aenderung sichern
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - "{{ lookup('ansible.builtin.file', role_path + '/files/snapshot.py') }}"
    stdin: "{{ lab_block02_files | to_json }}"
  register: lab_block02_snapshot
  changed_when: true
  when: not ansible_check_mode

- name: Rolle und Einstieg vollstaendig zur Sicherung kopieren
  ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '{{ lab_block02_snapshot.stdout }}/source/{{ item.name }}'
    owner: root
    group: root
    mode: preserve
  loop:
  - src: '{{ role_path }}/'
    name: role/
  - src: '{{ playbook_dir }}/block02-serial.yml'
    name: block02-serial.yml
  when:
  - not ansible_check_mode
  - not (lab_fresh_install | default(false) | bool)

- name: Aufgeloeste Berechtigungen fuer den Rueckweg dokumentieren
  cisco_lab_files:
    files:
    - dest: '{{ lab_block02_snapshot.stdout }}/settings.json'
      content: |
        {{ {'group': lab_serial_group, 'gid': ansible_facts.getent_group[lab_serial_group][1]} | to_nice_json }}
      mode: '0600'
  when: not ansible_check_mode

- name: Konsolenprogramme und Dialogwerkzeuge installieren
  ansible.builtin.apt:
    name:
    - putty
    - minicom
    - konsole
    - kdialog
    - python3
    - desktop-file-utils
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
  - not (lab_fresh_install | default(false) | bool)

- name: LAB-Dateien und Verzeichnisse gemeinsam bereitstellen
  cisco_lab_files:
    directories:
    - path: /etc/cisco-lab
      mode: '0755'
    - path: /usr/local/share/applications
      mode: '0755'
    - path: /usr/local/bin
      mode: '0755'
    - path: /usr/share/applications
      mode: '0755'
    - path: /etc/xdg/autostart
      mode: '0755'
    files:
    - src: lab_serial_console.py
      dest: /usr/local/bin/lab-serial-console
      mode: '0755'
    - src: putty.desktop
      dest: /usr/local/share/applications/putty.desktop
      mode: '0644'
    - src: cisco-console.desktop
      dest: /usr/share/applications/cisco-console.desktop
      mode: '0644'
    - src: disabled.desktop
      dest: /etc/xdg/autostart/lab-putty-defaults.desktop
      mode: '0644'
    - dest: /etc/cisco-lab/serial.json
      mode: '0644'
      content: '{{ lookup(''ansible.builtin.template'', role_path + ''/templates/serial.conf.j2'') }}'
    - dest: /etc/udev/rules.d/99-cisco-usb.rules
      mode: '0644'
      content: '{{ lookup(''ansible.builtin.template'', role_path + ''/templates/99-cisco-usb.rules.j2'') }}'
    - dest: /etc/tmpfiles.d/cisco-lab-serial.conf
      mode: '0644'
      content: '{{ lookup(''ansible.builtin.template'', role_path + ''/templates/cisco-lab-serial.conf.j2'') }}'

- name: Verzeichnis fuer gemeinsame Konsolensperren anlegen
  ansible.builtin.command:
    argv: [systemd-tmpfiles, --create, /etc/tmpfiles.d/cisco-lab-serial.conf]
  changed_when: true
  when: not ansible_check_mode

- name: Nur udev-Regeln neu laden
  ansible.builtin.command:
    argv: [udevadm, control, --reload-rules]
  changed_when: true
  when: not ansible_check_mode

- name: Geraeterechte nur fuer serielle USB-Geraete neu anwenden
  ansible.builtin.command:
    argv:
      - udevadm
      - trigger
      - --action=change
      - --subsystem-match=tty
      - "--sysname-match={{ item }}"
  loop: ['ttyUSB*', 'ttyACM*']
  changed_when: true
  when: not ansible_check_mode

- name: udev-Verarbeitung abschliessen
  ansible.builtin.command:
    argv: [udevadm, settle, --timeout=15]
  changed_when: false
  when: not ansible_check_mode

- name: Menue-Datenbanken aktualisieren
  ansible.builtin.command:
    argv: [update-desktop-database, "{{ item }}"]
  loop: [/usr/local/share/applications, /usr/share/applications]
  changed_when: true
  when: not ansible_check_mode

- name: Anmeldetest und Sicherungspfad anzeigen
  ansible.builtin.debug:
    msg: >-
      Nach der naechsten IServ-Anmeldung beide Konsolen mit realem Kabel testen.
      Kein sudo fuer Konsolenprogramme, keine Bearbeitung fremder Homes.
      Sicherung: {{ lab_block02_snapshot.stdout | default('Check-Mode: keine Sicherung erstellt') }}.
      Globale Minicom-/PuTTY-Profile bleiben erhalten.
