---
- name: Verzeichnisse für die Plasma-Bildvorgabe anlegen
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /usr/share/plasma/look-and-feel/de.bbs-einbeck.cisco-lab/contents
    - /usr/share/wallpapers/CiscoLab/contents/images

- name: KDE-Pakete für die Bildvorgabe registrieren
  ansible.builtin.copy:
    dest: "{{ item }}/metadata.json"
    owner: root
    group: root
    mode: '0644'
    content: "{{ {'KPlugin': {'Id': item | basename, 'Name': 'CISCO-LAB'}} | to_nice_json }}"
  loop:
    - /usr/share/plasma/look-and-feel/de.bbs-einbeck.cisco-lab
    - /usr/share/wallpapers/CiscoLab

- name: Debian-Plasma-Design mit dem LAB-Standardbild übernehmen
  ansible.builtin.copy:
    dest: /usr/share/plasma/look-and-feel/de.bbs-einbeck.cisco-lab/contents/defaults
    owner: root
    group: root
    mode: '0644'
    content: |
      [kdeglobals][KDE]
      widgetStyle=Breeze

      [kdeglobals][General]
      ColorScheme=BreezeLight

      [kdeglobals][Icons]
      Theme=breeze

      [plasmarc][Theme]
      name=breeze-dark

      [Desktop][org.kde.plasma.desktop]
      Containment=org.kde.desktopcontainment

      [Wallpaper]
      Image=CiscoLab

      [kcminputrc][Mouse]
      cursorTheme=breeze_cursors

      [kwinrc][org.kde.kdecoration2]
      library=org.kde.breeze
      theme=Breeze

      [KSplash]
      Theme=org.kde.Breeze

- name: KDE-Bildpaket mit dem verwalteten Desktopbild verknüpfen
  ansible.builtin.file:
    src: "{{ lab_desktop_wallpaper | default('/usr/share/backgrounds/lab.png') }}"
    dest: /usr/share/wallpapers/CiscoLab/contents/images/1920x1080.png
    state: link
    owner: root
    group: root
