# Known LAB client reset workaround, restored from grub-reboot-pci.yml.
# Keep the image's other kernel options and add the parameter only once.
case " ${GRUB_CMDLINE_LINUX_DEFAULT-} " in
    *" reboot=pci "*) ;;
    *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+${GRUB_CMDLINE_LINUX_DEFAULT} }reboot=pci" ;;
esac
