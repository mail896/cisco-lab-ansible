<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Cisco lab topology for one team</title>
  <desc id="desc">Two Intel NUCs use their internal network cards for IServ. Their USB Ethernet adapters connect to the exercise network through a switch and router on each side. The routers are linked.</desc>
  <rect width="960" height="480" rx="24" fill="#f2f6fb"/>
  <g font-family="system-ui, sans-serif" fill="#162b45" text-anchor="middle">
    <text x="480" y="51" font-size="30" font-weight="700">Network layout for one lab team</text>
    <text x="480" y="80" font-size="16" fill="#405b76">Two student seats with separate school and exercise networks</text>
    <g stroke="#1d66b0" stroke-width="4" fill="none">
      <path d="M234 170H308V274M726 170H652V274"/>
      <path d="M386 274V190H423M574 274V190H537M470 190H490"/>
    </g>
    <g stroke="#16804c" stroke-width="4" fill="none">
      <path d="M144 223V365H370M816 223V365H590"/>
    </g>
    <g fill="#fff" stroke="#9eb3ca" stroke-width="2">
      <rect x="54" y="115" width="180" height="108" rx="12"/>
      <rect x="726" y="115" width="180" height="108" rx="12"/>
    </g>
    <g font-size="18" font-weight="700">
      <text x="144" y="148">PC-A · Intel NUC</text>
      <text x="816" y="148">PC-B · Intel NUC</text>
    </g>
    <g font-size="14">
      <text x="144" y="176" fill="#1d66b0">USB Ethernet</text>
      <text x="816" y="176" fill="#1d66b0">USB Ethernet</text>
      <text x="144" y="205" fill="#16804c">Internal NIC</text>
      <text x="816" y="205" fill="#16804c">Internal NIC</text>
    </g>
    <g fill="#1d66b0">
      <rect x="288" y="274" width="118" height="46" rx="10"/>
      <rect x="554" y="274" width="118" height="46" rx="10"/>
      <circle cx="447" cy="190" r="25"/>
      <circle cx="513" cy="190" r="25"/>
    </g>
    <g fill="white" font-size="16" font-weight="700">
      <text x="347" y="303">Switch S1</text>
      <text x="613" y="303">Switch S2</text>
      <text x="447" y="196">R1</text>
      <text x="513" y="196">R2</text>
    </g>
    <text x="480" y="144" font-size="16" fill="#1d66b0" font-weight="700">Exercise network</text>
    <text x="480" y="256" font-size="14" fill="#405b76">Manual IPv4 and IPv6 addresses</text>
    <rect x="370" y="335" width="220" height="60" rx="11" fill="#e0f3e8" stroke="#16804c" stroke-width="2"/>
    <text x="480" y="360" font-size="18" fill="#12633b" font-weight="700">IServ school network</text>
    <text x="480" y="382" font-size="14" fill="#12633b">DHCP and default route</text>
    <path d="M250 440h35" stroke="#1d66b0" stroke-width="4"/>
    <text x="298" y="445" text-anchor="start" font-size="14">Exercise link</text>
    <path d="M515 440h35" stroke="#16804c" stroke-width="4"/>
    <text x="563" y="445" text-anchor="start" font-size="14">School link</text>
  </g>
</svg>
