---
- name: Veyon-Clientpakete bereitstellen
  ansible.builtin.apt:
    name: [veyon-service, veyon-plugins]
    state: present
    policy_rc_d: 101

- name: Verzeichnis für den öffentlichen Lehrerschlüssel bereitstellen
  ansible.builtin.file:
    path: /etc/veyon/keys/public/teacher
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ausschließlich den geprüften öffentlichen Lehrerschlüssel installieren
  ansible.builtin.copy:
    src: "{{ lab_fresh_veyon_public_key }}"
    dest: /etc/veyon/keys/public/teacher/key
    owner: root
    group: root
    mode: '0644'
  register: lab_fresh_veyon_key

- name: Geprüfte Veyon-Einstellungen festlegen
  ansible.builtin.set_fact:
    lab_fresh_veyon_settings:
      - {key: Authentication/Method, value: '1'}
      - {key: Authentication/PublicKeyBaseDir, value: '/etc/veyon/keys/public'}
      - {key: Network/LocalConnectOnly, value: 'false'}
      - {key: VncServer/Plugin, value: '{39d7a07f-94db-4912-aa1a-c4df8aee3879}'}

- name: Veyon-Einstellungen gemeinsam abgleichen und verifizieren
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -IB
      - -c
      - |
        import json, subprocess, sys
        changed = []
        for row in json.load(sys.stdin):
            command = ['veyon-cli', 'config', 'get', row['key']]
            previous = subprocess.run(command, text=True, capture_output=True)
            if previous.returncode not in (0, 255):
                raise SystemExit('Veyon-Einstellung nicht lesbar: ' + row['key'])
            if previous.returncode or previous.stdout.strip() != row['value']:
                subprocess.run(['veyon-cli', 'config', 'set', row['key'], row['value']],
                               check=True, capture_output=True)
                actual = subprocess.run(command, text=True, capture_output=True, check=True)
                if actual.stdout.strip() != row['value']:
                    raise SystemExit('Veyon-Einstellung nicht übernommen: ' + row['key'])
                changed.append(row['key'])
        print(json.dumps(changed))
    stdin: "{{ lab_fresh_veyon_settings | to_json }}"
  register: lab_fresh_veyon_config
  changed_when: (lab_fresh_veyon_config.stdout | from_json) | length > 0

- name: Tatsächlich konfigurierte Veyon-Schlüssel auflisten
  ansible.builtin.command:
    argv: [veyon-cli, authkeys, list]
  register: lab_fresh_veyon_keys
  changed_when: false

- name: Genau den öffentlichen Lehrerschlüssel verlangen
  ansible.builtin.assert:
    that: lab_fresh_veyon_keys.stdout_lines == ['teacher/public']

- name: Veyon-Client aktivieren
  ansible.builtin.systemd_service:
    name: veyon.service
    enabled: true
    state: "{{ 'restarted' if (lab_fresh_veyon_key.changed or lab_fresh_veyon_config.changed) else 'started' }}"

- name: Veyon-Port vom Lehrer-PC prüfen
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 11100
    timeout: 15
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
